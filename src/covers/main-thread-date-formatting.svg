<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    :root { --bg:#F2F2F7; --card:#fff; --neutral:#E5E5EA; --primary:#FF8D28; --ink:#A74700; --accent:#34C759; --symbol:#fff; }
    @media (prefers-color-scheme:dark) {
      :root { --bg:#1C1C1E; --card:#2C2C2E; --neutral:#3A3A3C; --primary:#FF9230; --ink:#FF9230; --accent:#30D158; --symbol:#000; }
      .shadow { filter:none; }
    }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); }
    .neutral { fill:var(--neutral); }
    .primary { fill:var(--primary); }
    .accent { fill:var(--accent); }
    .connector { fill:none; stroke:var(--accent); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .clock { fill:none; stroke:var(--symbol); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .label { fill:var(--ink); font:600 24px 'SF Mono',ui-monospace,Menlo,monospace; }
  </style>
  <defs>
    <filter id="sombra"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.07"/></filter>
    <g id="clock"><circle class="clock" cx="24" cy="24" r="13"/><path class="clock" d="M24 15v9l7 4"/></g>
  </defs>
  <rect class="bg" width="1200" height="630"/>
  <!-- The same formatter configuration is repeated or shared within one batch. -->
  <text class="label" x="600" y="120" text-anchor="middle">DateFormatter</text>
  <g class="shadow" filter="url(#sombra)">
    <rect class="card" x="304" y="152" width="256" height="336" rx="32"/>
    <rect class="card" x="640" y="152" width="256" height="336" rx="32"/>
  </g>
  <text class="label" x="336" y="200">12 000×</text>
  <text class="label" x="672" y="200">1×</text>
  <!-- One formatter per row. -->
  <g transform="translate(336 232)"><rect class="primary" width="48" height="48" rx="24"/><use href="#clock"/></g>
  <g transform="translate(336 312)"><rect class="primary" width="48" height="48" rx="24"/><use href="#clock"/></g>
  <g transform="translate(336 392)"><rect class="primary" width="48" height="48" rx="24"/><use href="#clock"/></g>
  <rect class="neutral" x="408" y="249" width="120" height="14" rx="7"/>
  <rect class="neutral" x="408" y="329" width="120" height="14" rx="7"/>
  <rect class="neutral" x="408" y="409" width="120" height="14" rx="7"/>
  <!-- One local formatter supplies every row in the batch. -->
  <path class="connector" d="M720 336h24M744 256v160M744 256h16M744 336h16M744 416h16"/>
  <g transform="translate(672 312)"><rect class="accent" width="48" height="48" rx="24"/><use href="#clock"/></g>
  <rect class="neutral" x="768" y="249" width="96" height="14" rx="7"/>
  <rect class="neutral" x="768" y="329" width="96" height="14" rx="7"/>
  <rect class="neutral" x="768" y="409" width="96" height="14" rx="7"/>
</svg>
