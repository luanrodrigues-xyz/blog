<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg {
      --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA;
      --principal: #0088FF; --principal-texto: #005FB3; --sobre-principal: #fff;
      --destaque: #FF8D28; --destaque-tinta: #FFE7CF; --sobre-destaque: #fff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C;
        --principal: #35A4FF; --principal-texto: #8CC8FF; --sobre-principal: #fff;
        --destaque: #FF9230; --destaque-tinta: color-mix(in srgb, var(--destaque) 22%, var(--card)); --sobre-destaque: #fff;
      }
      .sombreado { filter: none; }
    }
    .fundo { fill: var(--fundo); } .card { fill: var(--card); } .neutro { fill: var(--neutro); }
    .destaque { fill: var(--destaque); }
    .texto { fill: var(--principal-texto); }
    .vazio { fill: none; stroke: var(--neutro); stroke-width: 3; stroke-dasharray: 1 10; stroke-linecap: round; }
    .ligacao { fill: none; stroke: var(--neutro); stroke-width: 3; stroke-dasharray: 1 10; stroke-linecap: round; }
    .rotulo { font-family: SF Mono, ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; }
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>

  <!-- let: the same append is attempted, but the fourth slot never lands. -->
  <text class="texto rotulo" x="350" y="223" text-anchor="end">let</text>
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="380" y="160" width="440" height="112" rx="32"/>
  </g>
  <rect class="neutro" x="448" y="196" width="64" height="40" rx="20"/>
  <rect class="neutro" x="528" y="196" width="64" height="40" rx="20"/>
  <rect class="neutro" x="608" y="196" width="64" height="40" rx="20"/>
  <rect class="vazio" x="688" y="196" width="64" height="40" rx="20"/>

  <!-- var: the fourth slot is accepted and stays, highlighted in the second color. -->
  <text class="texto rotulo" x="350" y="421" text-anchor="end">var</text>
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="380" y="358" width="440" height="112" rx="32"/>
  </g>
  <rect class="neutro" x="448" y="394" width="64" height="40" rx="20"/>
  <rect class="neutro" x="528" y="394" width="64" height="40" rx="20"/>
  <rect class="neutro" x="608" y="394" width="64" height="40" rx="20"/>
  <rect class="destaque" x="688" y="394" width="64" height="40" rx="20"/>

  <!-- Same attempted position in both collections; only one keeps the new entry. -->
  <path class="ligacao" d="M720 236V394"/>
</svg>
