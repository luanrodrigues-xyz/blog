<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg { --fundo:#F2F2F7; --card:#fff; --neutro:#E5E5EA; --principal:#00C0E8; --tinta:#D9F6FC; --destaque:#6155F5; --destaque-tinta:#E7E4FD; --texto:#00596B; }
    @media(prefers-color-scheme:dark) {
      svg { --fundo:#1C1C1E; --card:#2C2C2E; --neutro:#3A3A3C; --principal:#5CD7F5; --tinta:color-mix(in srgb,var(--principal) 30%,var(--card)); --destaque:#6D7CFF; --destaque-tinta:color-mix(in srgb,var(--destaque) 22%,var(--card)); --texto:#5CD7F5; }
      .sombreado { filter:none; }
    }
    .fundo { fill:var(--fundo); } .card { fill:var(--card); } .neutro { fill:var(--neutro); } .principal { fill:var(--principal); } .tinta { fill:var(--tinta); } .destaque { fill:var(--destaque); } .destaque-tinta { fill:var(--destaque-tinta); }
    .linha { fill:none; stroke:var(--principal); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; } .alternativa { stroke:var(--destaque); stroke-dasharray:8 8; }
  </style>
  <defs><filter id="sombra" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter></defs>
  <rect class="fundo" width="1200" height="630"/>
  <!-- Two sources with the same plug shape. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="tinta" x="376" y="112" width="176" height="144" rx="24"/>
    <rect class="destaque-tinta" x="648" y="112" width="176" height="144" rx="24"/>
  </g>
  <rect class="principal" x="440" y="240" width="48" height="40" rx="8"/>
  <rect class="destaque" x="712" y="240" width="48" height="40" rx="8"/>
  <rect class="principal" x="408" y="152" width="112" height="14" rx="7"/>
  <rect class="principal" x="408" y="184" width="80" height="14" rx="7"/>
  <rect class="destaque" x="680" y="152" width="112" height="14" rx="7"/>
  <rect class="destaque" x="680" y="184" width="80" height="14" rx="7"/>
  <!-- Solid selected route and dashed alternative meet the same input. -->
  <path class="linha" d="M464 296V320H600V352"/>
  <path class="linha alternativa" d="M736 296V320H632"/>
  <polygon class="principal" points="600,364 592,348 608,348"/>
  <!-- Consumer with one matching socket and a stable rule. -->
  <g class="sombreado" filter="url(#sombra)"><rect class="card" x="456" y="384" width="288" height="160" rx="32"/></g>
  <path class="linha" d="M576 384V416H624V384"/>
  <rect class="neutro" x="488" y="448" width="224" height="14" rx="7"/>
  <rect class="neutro" x="488" y="480" width="160" height="14" rx="7"/>
</svg>
