<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg {
      --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA;
      --principal: #0088FF; --texto: #005FB3; --tinta: #D6EAFF; --destaque: #FF8D28;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C;
        --principal: #35A4FF; --texto: #8CC8FF; --tinta: color-mix(in srgb, var(--principal) 30%, var(--card));
        --destaque: #FF9230;
      }
      .sombreado { filter: none; }
    }
    .fundo { fill: var(--fundo); }
    .card { fill: var(--card); }
    .neutro { fill: var(--neutro); }
    .tinta { fill: var(--tinta); }
    .principal { fill: var(--principal); }
    .destaque { fill: var(--destaque); }
    .ausente { fill: none; stroke: var(--principal); stroke-width: 4; stroke-dasharray: 8 8; }
    .texto { fill: var(--texto); font-family: SF Mono, ui-monospace, Menlo, monospace; font-size: 24px; font-weight: 600; }
    .copia { fill: none; stroke: var(--principal); stroke-width: 4; stroke-linecap: round; }
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>
  <!-- A default makes absent and present-zero inputs indistinguishable. -->
  <text class="texto" x="600" y="128" text-anchor="middle">?? 0</text>
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="312" y="152" width="576" height="144" rx="32"/>
    <rect class="card" x="312" y="352" width="576" height="144" rx="32"/>
  </g>
  <rect class="ausente" x="344" y="184" width="64" height="32" rx="16"/>
  <rect class="principal" x="344" y="240" width="64" height="32" rx="16"/>
  <path class="copia" d="M432 200L600 228M432 256L600 228H672"/>
  <path class="principal" d="M672 220L688 228L672 236Z"/>
  <rect class="destaque" x="712" y="208" width="144" height="32" rx="16"/>

  <!-- Binding preserves a separate result for absence and for a present value. -->
  <text class="texto" x="600" y="328" text-anchor="middle">guard let</text>
  <rect class="ausente" x="344" y="384" width="64" height="32" rx="16"/>
  <rect class="principal" x="344" y="440" width="64" height="32" rx="16"/>
  <path class="copia" d="M432 400H672M432 456H672"/>
  <path class="principal" d="M672 392L688 400L672 408ZM672 448L688 456L672 464Z"/>
  <rect class="ausente" x="712" y="384" width="144" height="32" rx="16"/>
  <rect class="principal" x="712" y="440" width="144" height="32" rx="16"/>
</svg>
