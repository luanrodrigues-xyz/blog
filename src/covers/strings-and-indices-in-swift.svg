<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
:root{--bg:#F2F2F7;--card:#fff;--neutral:#E5E5EA;--primary:#0088FF;--ink:#005FB3;--tint:#D6EAFF;--accent:#6155F5}
@media(prefers-color-scheme:dark){:root{--bg:#1C1C1E;--card:#2C2C2E;--neutral:#3A3A3C;--primary:#35A4FF;--ink:#B8DEFF;--tint:color-mix(in srgb,var(--primary) 30%,var(--card));--accent:#A29BFF}.shadow{filter:none}}
.bg{fill:var(--bg)}.card{fill:var(--card)}.neutral{fill:var(--neutral)}.primary{fill:var(--primary)}.tint{fill:var(--tint)}.accent{fill:var(--accent)}.line{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round}.label{fill:var(--ink);font:600 25px 'SF Mono',ui-monospace,Menlo,monospace}
</style>
<defs><filter id="sombra"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.07"/></filter></defs>
<rect class="bg" width="1200" height="630"/>
<!-- One combined character covers three UTF-8 bytes. A covers one. -->
<g class="shadow" filter="url(#sombra)">
<rect class="card" x="352" y="176" width="288" height="144" rx="32"/>
<rect class="card" x="688" y="176" width="96" height="144" rx="32"/>
</g>
<text class="label" x="496" y="257" text-anchor="middle">e&#x301;</text>
<text class="label" x="736" y="257" text-anchor="middle">A</text>
<!-- Equal-size lower cells each represent one encoded byte. -->
<path class="line" d="M352 344H640M688 344H784"/>
<g class="shadow" filter="url(#sombra)">
<rect class="card" x="352" y="376" width="80" height="80" rx="24"/>
<rect class="card" x="456" y="376" width="80" height="80" rx="24"/>
<rect class="card" x="560" y="376" width="80" height="80" rx="24"/>
<rect class="card" x="688" y="376" width="80" height="80" rx="24"/>
</g>
<rect class="primary" x="368" y="409" width="48" height="14" rx="7"/>
<rect class="primary" x="472" y="409" width="48" height="14" rx="7"/>
<rect class="primary" x="576" y="409" width="48" height="14" rx="7"/>
<rect class="primary" x="704" y="409" width="48" height="14" rx="7"/>
</svg>