<rect class="tint" x="320" y="176" width="224" height="128" rx="24"/>
<rect class="tint" x="656" y="326" width="224" height="128" rx="24"/>
<text class="label" x="336" y="218">reading-tips</text><text class="label" x="672" y="368">reading-tips</text>
