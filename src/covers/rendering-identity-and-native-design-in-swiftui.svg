<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
:root{--bg:#F2F2F7;--card:#fff;--neutral:#E5E5EA;--primary:#6155F5;--ink:#3829A8;--tint:#E8E5FF;--accent:#176A2C}
@media(prefers-color-scheme:dark){:root{--bg:#1C1C1E;--card:#2C2C2E;--neutral:#3A3A3C;--primary:#A29BFF;--ink:#CEC9FF;--tint:color-mix(in srgb,var(--primary) 30%,var(--card));--accent:#9DE7AF}.shadow{filter:none}}
.bg{fill:var(--bg)}.card{fill:var(--card)}.neutral{fill:var(--neutral)}.tint{fill:var(--tint)}.line{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round}.tip{fill:var(--primary)}.label{fill:var(--ink);font:600 21px 'SF Mono',ui-monospace,Menlo,monospace}.mark{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><filter id="sombra"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.07"/></filter></defs>
<rect class="bg" width="1200" height="630"/>
