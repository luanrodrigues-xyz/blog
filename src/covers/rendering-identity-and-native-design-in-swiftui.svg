<rect class="neutral" x="384" y="246" width="136" height="14" rx="7"/><rect class="neutral" x="720" y="396" width="136" height="14" rx="7"/>
<rect class="neutral" x="336" y="350" width="192" height="14" rx="7"/><rect class="neutral" x="336" y="398" width="136" height="14" rx="7"/>
<rect class="neutral" x="672" y="200" width="192" height="14" rx="7"/><rect class="neutral" x="672" y="248" width="136" height="14" rx="7"/>
