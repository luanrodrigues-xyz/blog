<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg { --fundo:#F2F2F7; --card:#fff; --neutro:#E5E5EA; --principal:#6155F5; --tinta:#E3E0FD; --texto:#564ADE; --destaque:#C61226; --sobre:#fff; }
    @media (prefers-color-scheme:dark) {
      svg { --fundo:#1C1C1E; --card:#2C2C2E; --neutro:#3A3A3C; --principal:#6D7CFF; --tinta:color-mix(in srgb,var(--principal) 30%,var(--card)); --texto:#8390FF; --destaque:#FF686A; --sobre:#fff; }
      .sombreado { filter:none; }
    }
    .fundo { fill:var(--fundo); } .card { fill:var(--card); }
    .neutro { fill:var(--neutro); } .principal { fill:var(--principal); }
    .tinta { fill:var(--tinta); } .sobre { fill:var(--sobre); }
    .rotulo { font-family:SF Mono,ui-monospace,Menlo,monospace; font-size:27px; font-weight:600; fill:var(--texto); }
    .rotulo.sobre { fill:var(--sobre); }
    .rejeitado { fill:none; stroke:var(--destaque); stroke-width:4; stroke-linecap:round; }
    .confirmado { fill:none; stroke:var(--sobre); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <defs><filter id="sombra" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter></defs>
  <rect class="fundo" width="1200" height="630"/>
  <!-- Rejection removes only the older operation. -->
  <g class="sombreado" filter="url(#sombra)"><rect class="card" x="392" y="152" width="416" height="120" rx="32"/></g>
  <text class="rotulo" x="424" y="224">A</text>
  <rect class="neutro" x="480" y="192" width="240" height="14" rx="7"/>
  <rect class="neutro" x="480" y="224" width="176" height="14" rx="7"/>
  <path class="rejeitado" d="M760 196 792 228M792 196 760 228"/>
  <!-- The accepted later title remains intact. -->
  <g class="sombreado" filter="url(#sombra)"><rect class="principal" x="392" y="336" width="416" height="144" rx="32"/></g>
  <text class="rotulo sobre" x="424" y="420">B</text>
  <rect class="sobre" x="480" y="376" width="240" height="14" rx="7"/>
  <rect class="tinta" x="480" y="408" width="176" height="14" rx="7"/>
  <rect class="tinta" x="480" y="440" width="208" height="14" rx="7"/>
  <path class="confirmado" d="m752 408 16 16 24-32"/>
</svg>
