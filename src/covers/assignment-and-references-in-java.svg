<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg { --bg:#F2F2F7; --card:#fff; --neutral:#E5E5EA; --primary:#34C759; --tint:#DDF5E3; --ink:#00742B; }
    @media(prefers-color-scheme:dark) {
      svg { --bg:#1C1C1E; --card:#2C2C2E; --neutral:#3A3A3C; --primary:#30D158; --tint:color-mix(in srgb,var(--primary) 30%,var(--card)); --ink:#6EE186; }
      .shadow { filter:none; }
    }
    .bg { fill:var(--bg); } .card { fill:var(--card); } .neutral { fill:var(--neutral); }
    .primary { fill:var(--primary); } .tint { fill:var(--tint); } .tip { fill:var(--ink); }
    .label { fill:var(--ink); font:600 24px 'SF Mono',ui-monospace,Menlo,monospace; }
    .reference { fill:none; stroke:var(--ink); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <defs><filter id="sombra" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter></defs>
  <rect class="bg" width="1200" height="630"/>
  <!-- Assignment leaves two variables with references to one object. -->
  <g class="shadow" filter="url(#sombra)">
    <rect class="card" x="336" y="144" width="208" height="104" rx="24"/>
    <rect class="card" x="656" y="144" width="208" height="104" rx="24"/>
  </g>
  <text class="label" x="368" y="204">original</text>
  <text class="label" x="696" y="204">draft</text>
  <path class="reference" d="M440 248V312H536V364"/>
  <path class="reference" d="M760 248V312H664V364"/>
  <path class="tip" d="M528 364L536 380L544 364Z"/>
  <path class="tip" d="M656 364L664 380L672 364Z"/>
  <!-- The one shared object has one quantity field. -->
  <g class="shadow" filter="url(#sombra)"><rect class="tint" x="472" y="384" width="256" height="144" rx="32"/></g>
  <rect class="card" x="504" y="416" width="160" height="14" rx="7"/>
  <rect class="primary" x="504" y="472" width="112" height="14" rx="7"/>
</svg>
