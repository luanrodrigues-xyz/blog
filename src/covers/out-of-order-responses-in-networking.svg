<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg {
      --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA;
      --principal: #00C0E8; --principal-texto: #006B94; --principal-tinta: #D2F2FC; --sobre-principal: #000;
      --destaque: #FF383C; --destaque-texto: #C61226; --destaque-tinta: #FFD9DA; --sobre-destaque: #fff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C;
        --principal: #3CD3FE; --principal-texto: #3CD3FE; --principal-tinta: color-mix(in srgb, var(--principal) 22%, var(--card)); --sobre-principal: #000;
        --destaque: #FF4245; --destaque-texto: #FF686A; --destaque-tinta: color-mix(in srgb, var(--destaque) 22%, var(--card)); --sobre-destaque: #fff;
      }
      .sombreado { filter: none; }
    }
    .fundo { fill: var(--fundo); }
    .card { fill: var(--card); }
    .principal { fill: var(--principal); }
    .principal-tinta { fill: var(--principal-tinta); }
    .destaque { fill: var(--destaque); }
    .destaque-tinta { fill: var(--destaque-tinta); }
    .texto-principal { fill: var(--principal-texto); }
    .texto-destaque { fill: var(--destaque-texto); }
    .linha-principal { fill: none; stroke: var(--principal); stroke-width: 4; stroke-linecap: round; }
    .linha-destaque { fill: none; stroke: var(--destaque); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 11; }
    .ponta-principal { fill: var(--principal); }
    .rotulo { font-family: SF Mono, ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 600; }
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>

  <!-- swift: starts first, is still in flight when swiftui's answer already won the gate. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="300" y="160" width="176" height="112" rx="32"/>
  </g>
  <text class="texto-destaque rotulo" x="324" y="208">swift</text>
  <rect class="destaque-tinta" x="324" y="226" width="128" height="12" rx="6"/>

  <!-- swiftui: starts later, resolves first, reaches the gate while it is still open. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="300" y="358" width="176" height="112" rx="32"/>
  </g>
  <text class="texto-principal rotulo" x="324" y="406">swiftui</text>
  <rect class="principal-tinta" x="324" y="424" width="128" height="12" rx="6"/>

  <!-- swiftui reaches the gate: elbow connector, solid, arrowhead into the gate. -->
  <path class="linha-principal" d="M476 414H528V315H552"/>
  <polygon class="ponta-principal" points="560,315 542,307 542,323"/>

  <!-- swift never reaches the gate: dashed connector stops at the rejection badge. -->
  <path class="linha-destaque" d="M476 216H536V305"/>
  <circle class="destaque" cx="536" cy="315" r="20"/>
  <path d="M528 307 544 323M544 307 528 323" stroke="var(--sobre-destaque)" stroke-width="5" stroke-linecap="round"/>

  <!-- The gate: only one requestID is still active, so only one answer commits. -->
  <rect class="principal" x="560" y="249" width="140" height="132" rx="24"/>
  <rect x="598" y="281" width="64" height="10" rx="5" fill="var(--sobre-principal)"/>
  <path d="M598 319 622 343 664 299" fill="none" stroke="var(--sobre-principal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The committed state, carrying only the value the gate let through. -->
  <path class="linha-principal" d="M700 315H752"/>
  <polygon class="ponta-principal" points="760,315 742,307 742,323"/>
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="760" y="233" width="150" height="164" rx="32"/>
  </g>
  <rect class="principal" x="792" y="265" width="86" height="14" rx="7"/>
  <rect class="principal-tinta" x="792" y="297" width="86" height="22" rx="11"/>
  <rect class="principal-tinta" x="792" y="331" width="86" height="22" rx="11"/>
</svg>
