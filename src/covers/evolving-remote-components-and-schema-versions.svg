<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
:root{--bg:#F2F2F7;--card:#fff;--neutral:#E5E5EA;--primary:#34C759;--ink:#176A2C;--tint:#DCF4E2;--accent:#B25400}
@media(prefers-color-scheme:dark){:root{--bg:#1C1C1E;--card:#2C2C2E;--neutral:#3A3A3C;--primary:#30D158;--ink:#9DE7AF;--tint:color-mix(in srgb,var(--primary) 30%,var(--card));--accent:#FFB66F}.shadow{filter:none}}
.bg{fill:var(--bg)}.card{fill:var(--card)}.neutral{fill:var(--neutral)}.primary{fill:var(--primary)}.tint{fill:var(--tint)}.line{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round}.tip{fill:var(--primary)}.stop{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}.label{fill:var(--ink);font:600 25px 'SF Mono',ui-monospace,Menlo,monospace}
</style>
<defs><filter id="sombra"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.07"/></filter></defs>
