<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg { --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA; --principal: #0088FF; --tinta: #D6EAFF; --destaque: #FF8D28; }
    @media (prefers-color-scheme: dark) {
      svg { --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C; --principal: #35A4FF; --tinta: color-mix(in srgb, var(--principal) 30%, var(--card)); --destaque: #FF9230; }
      .sombreado { filter: none; }
    }
    .fundo { fill: var(--fundo); } .card { fill: var(--card); }
    .neutro { fill: var(--neutro); } .tinta { fill: var(--tinta); }
    .principal { fill: var(--principal); } .destaque { fill: var(--destaque); }
    .referencia { fill: none; stroke: var(--principal); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>
  <!-- Separate invoice values, with an independent total in each. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="344" y="104" width="224" height="176" rx="32"/>
    <rect class="card" x="632" y="104" width="224" height="176" rx="32"/>
  </g>
  <rect class="neutro" x="376" y="136" width="112" height="14" rx="7"/>
  <rect class="principal" x="376" y="176" width="96" height="14" rx="7"/>
  <rect class="tinta" x="376" y="216" width="160" height="32" rx="16"/>
  <rect class="neutro" x="664" y="136" width="112" height="14" rx="7"/>
  <rect class="principal" x="664" y="176" width="144" height="14" rx="7"/>
  <rect class="tinta" x="664" y="216" width="160" height="32" rx="16"/>
  <!-- Both references reach one card. Changing it is visible through either invoice. -->
  <path class="referencia" d="M456 248V328L552 384M744 248V328L648 384"/>
  <path class="principal" d="M545 377L562 390L542 390ZM655 377L638 390L658 390Z"/>
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="488" y="400" width="224" height="128" rx="24"/>
  </g>
  <rect class="neutro" x="520" y="432" width="112" height="14" rx="7"/>
  <rect class="destaque" x="520" y="480" width="160" height="14" rx="7"/>
</svg>
