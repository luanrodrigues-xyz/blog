<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg {
      --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA;
      --principal: #CB30E0; --principal-tinta: #F6DAF9; --sobre-principal: #fff;
      --destaque: #FF383C; --sobre-destaque: #fff;
      --verde: #34C759; --sobre-verde: #fff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C;
        --principal: #DB34F2; --principal-tinta: color-mix(in srgb, var(--principal) 30%, var(--card)); --sobre-principal: #fff;
        --destaque: #FF4245; --sobre-destaque: #fff;
        --verde: #30D158; --sobre-verde: #000;
      }
      .sombreado { filter: none; }
    }
    .fundo { fill: var(--fundo); }
    .card { fill: var(--card); }
    .principal { fill: var(--principal); }
    .principal-tinta { fill: var(--principal-tinta); }
    .destaque { fill: var(--destaque); }
    .verde { fill: var(--verde); }
    .barra-fantasma { fill: none; stroke: var(--neutro); stroke-width: 3; stroke-dasharray: 6 7; }
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>

  <!-- Strict decoder: the same three nodes, none of them rendered, because the array decode threw. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="320" y="175" width="240" height="280" rx="32"/>
  </g>
  <rect class="barra-fantasma" x="356" y="260" width="168" height="18" rx="9"/>
  <rect class="barra-fantasma" x="356" y="306" width="168" height="18" rx="9"/>
  <rect class="barra-fantasma" x="356" y="352" width="168" height="18" rx="9"/>
  <circle class="destaque" cx="560" cy="175" r="22"/>
  <path d="M551 166 569 184M569 166 551 184" stroke="var(--sobre-destaque)" stroke-width="5" stroke-linecap="round"/>

  <!-- Forgiving decoder: the unknown node stays a ghost bar, the other two still render. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="640" y="175" width="240" height="280" rx="32"/>
  </g>
  <rect class="principal" x="676" y="260" width="168" height="18" rx="9"/>
  <rect class="barra-fantasma" x="676" y="306" width="168" height="18" rx="9"/>
  <rect class="principal" x="676" y="352" width="168" height="18" rx="9"/>
  <circle class="verde" cx="880" cy="175" r="22"/>
  <path d="M870 176 877 183 891 168" fill="none" stroke="var(--sobre-verde)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
