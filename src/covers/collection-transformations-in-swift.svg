<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
:root{--bg:#F2F2F7;--card:#fff;--neutral:#E5E5EA;--primary:#0088FF;--ink:#005FB3;--tint:#D6EAFF;--muted:#636366}
@media(prefers-color-scheme:dark){:root{--bg:#1C1C1E;--card:#2C2C2E;--neutral:#3A3A3C;--primary:#35A4FF;--ink:#B8DEFF;--tint:color-mix(in srgb,var(--primary) 30%,var(--card));--muted:#AEAEB2}.shadow{filter:none}}
.bg{fill:var(--bg)}.card{fill:var(--card)}.neutral{fill:var(--neutral)}.primary{fill:var(--primary)}.tint{fill:var(--tint)}.absent{fill:none;stroke:var(--muted);stroke-width:4;stroke-dasharray:6 7}.line{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round}.label{fill:var(--ink);font:600 25px 'SF Mono',ui-monospace,Menlo,monospace}.missing{fill:var(--muted)}
</style>
