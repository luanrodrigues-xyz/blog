<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg {
      --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA;
      --principal: #0088FF; --tinta: #D6EAFF; --destaque: #FF8D28;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C;
        --principal: #35A4FF; --tinta: color-mix(in srgb, var(--principal) 30%, var(--card));
        --destaque: #FF9230;
      }
      .sombreado { filter: none; }
    }
    .fundo { fill: var(--fundo); }
    .card { fill: var(--card); }
    .neutro { fill: var(--neutro); }
    .tinta { fill: var(--tinta); }
    .principal { fill: var(--principal); }
    .destaque { fill: var(--destaque); }
    .copia { fill: none; stroke: var(--principal); stroke-width: 4; stroke-linecap: round; }
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>

  <!-- The statement contains two entries. The original value stays blue. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="312" y="144" width="256" height="336" rx="32"/>
  </g>
  <rect class="tinta" x="336" y="184" width="208" height="112" rx="24"/>
  <rect class="neutro" x="360" y="208" width="120" height="14" rx="7"/>
  <rect class="principal" x="360" y="248" width="96" height="14" rx="7"/>
  <rect class="neutro" x="336" y="328" width="208" height="112" rx="24"/>
  <rect class="card" x="360" y="352" width="120" height="14" rx="7"/>
  <rect class="card" x="360" y="392" width="96" height="14" rx="7"/>

  <!-- Copying creates a separate draft, with the same description and a changed value. -->
  <path class="copia" d="M568 240H640"/>
  <path class="principal" d="M640 232L656 240L640 248Z"/>
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="680" y="184" width="208" height="112" rx="24"/>
  </g>
  <rect class="neutro" x="704" y="208" width="120" height="14" rx="7"/>
  <rect class="destaque" x="704" y="248" width="144" height="14" rx="7"/>
</svg>
