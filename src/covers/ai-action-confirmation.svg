<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
svg{--fundo:#F2F2F7;--card:#fff;--neutro:#E5E5EA;--principal:#6155F5;--tinta:#E3E0FD;--texto:#564ADE;--secundario:#34C759}
@media(prefers-color-scheme:dark){svg{--fundo:#1C1C1E;--card:#2C2C2E;--neutro:#3A3A3C;--principal:#6D7CFF;--tinta:color-mix(in srgb,var(--principal) 30%,var(--card));--texto:#8390FF;--secundario:#30D158}.sombreado{filter:none}}
.fundo{fill:var(--fundo)}.card{fill:var(--card)}.neutro{fill:var(--neutro)}.principal{fill:var(--principal)}.tinta{fill:var(--tinta)}.linha{fill:none;stroke:var(--principal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.interrompida{fill:none;stroke:var(--neutro);stroke-width:4;stroke-dasharray:8 12;stroke-linecap:round}.aprovacao{fill:none;stroke:var(--secundario);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.rotulo{fill:var(--texto);font:600 25px SF Mono,ui-monospace,Menlo,monospace}
</style>
<defs><filter id="sombra" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".07"/></filter></defs>
<rect class="fundo" width="1200" height="630"/>
<!-- A proposed invoice action cannot take the direct path. -->
<g class="sombreado" filter="url(#sombra)"><rect class="card" x="336" y="224" width="160" height="176" rx="32"/></g>
<rect class="tinta" x="360" y="248" width="112" height="24" rx="8"/><rect class="neutro" x="360" y="296" width="88" height="14" rx="7"/><rect class="neutro" x="360" y="328" width="112" height="14" rx="7"/>
<path class="interrompida" d="M416 208V152H552M648 152H784V208"/>
<path class="linha" d="M584 136l32 32m0-32-32 32"/>
<!-- A reviewed confirmation is the gate to execution. -->
<rect class="card" x="544" y="272" width="112" height="112" rx="24"/>
<path class="aprovacao" d="m572 328 20 20 36-44"/>
<path class="linha" d="M504 328H536M664 328H696"/><path class="principal" d="m688 320 16 8-16 8z"/>
<text class="rotulo" x="550" y="424">review</text>
<g class="sombreado" filter="url(#sombra)"><rect class="card" x="704" y="224" width="160" height="176" rx="32"/></g>
<rect class="tinta" x="728" y="248" width="112" height="24" rx="8"/><text class="rotulo" x="752" y="328">void</text><rect class="neutro" x="728" y="352" width="80" height="14" rx="7"/>
</svg>
