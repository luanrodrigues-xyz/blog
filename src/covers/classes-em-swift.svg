<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg { --fundo: #F2F2F7; --card: #fff; --neutro: #E5E5EA; --principal: #0088FF; --tinta: #D6EAFF; --destaque: #FF8D28; }
    @media (prefers-color-scheme: dark) {
      svg { --fundo: #1C1C1E; --card: #2C2C2E; --neutro: #3A3A3C; --principal: #35A4FF; --tinta: color-mix(in srgb, var(--principal) 30%, var(--card)); --destaque: #FF9230; }
      .sombreado { filter: none; }
    }
    .fundo {fill:var(--fundo)} .card {fill:var(--card)} .neutro {fill:var(--neutro)}
    .principal {fill:var(--principal)} .tinta {fill:var(--tinta)} .destaque {fill:var(--destaque)}
    .referencia {fill:none;stroke:var(--principal);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect class="fundo" width="1200" height="630"/>
  <!-- Two bindings each hold a reference, without a separate account value. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="312" y="208" width="184" height="80" rx="24"/>
    <rect class="card" x="312" y="368" width="184" height="80" rx="24"/>
  </g>
  <rect class="principal" x="344" y="240" width="120" height="14" rx="7"/>
  <rect class="principal" x="344" y="400" width="120" height="14" rx="7"/>
  <path class="referencia" d="M508 248H540L608 288M508 408H540L608 368"/>
  <path class="principal" d="M603 279L621 296L598 293ZM598 363L621 360L603 377Z"/>
  <!-- One shared account contains one balance, changed through either reference. -->
  <g class="sombreado" filter="url(#sombra)">
    <rect class="card" x="632" y="192" width="256" height="272" rx="32"/>
  </g>
  <rect class="neutro" x="664" y="232" width="144" height="14" rx="7"/>
  <rect class="tinta" x="664" y="280" width="192" height="64" rx="24"/>
  <rect class="neutro" x="688" y="304" width="120" height="14" rx="7"/>
  <rect class="destaque" x="664" y="384" width="160" height="14" rx="7"/>
</svg>
