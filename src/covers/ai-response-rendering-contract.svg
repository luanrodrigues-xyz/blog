<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    svg { --fundo:#F2F2F7; --card:#fff; --neutro:#E5E5EA; --principal:#6155F5; --tinta:#E3E0FD; --texto:#564ADE; }
    @media(prefers-color-scheme:dark) {
      svg { --fundo:#1C1C1E; --card:#2C2C2E; --neutro:#3A3A3C; --principal:#6D7CFF; --tinta:color-mix(in srgb,var(--principal) 30%,var(--card)); --texto:#8390FF; }
      .sombreado { filter:none; }
    }
    .fundo { fill:var(--fundo); } .card { fill:var(--card); } .neutro { fill:var(--neutro); }
    .principal { fill:var(--principal); } .tinta { fill:var(--tinta); }
    .linha { fill:none; stroke:var(--principal); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .rotulo { fill:var(--texto); font:600 27px SF Mono,ui-monospace,Menlo,monospace; }
  </style>
  <defs><filter id="sombra" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter></defs>
  <rect class="fundo" width="1200" height="630"/>
