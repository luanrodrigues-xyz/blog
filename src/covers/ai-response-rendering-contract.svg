  <g class="sombreado" filter="url(#sombra)"><rect class="card" x="320" y="256" width="176" height="144" rx="32"/></g>
  <text class="rotulo" x="352" y="312">type</text>
  <rect class="tinta" x="352" y="336" width="112" height="14" rx="7"/>
  <rect class="neutro" x="352" y="368" width="80" height="14" rx="7"/>
  <path class="linha" d="M512 328H552V264H624"/>
  <path class="principal" d="m624 256 16 8-16 8z"/>
