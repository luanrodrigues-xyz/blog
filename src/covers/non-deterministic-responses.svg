<rect class="tinta" x="360" y="192" width="128" height="14" rx="7"/>
<rect class="neutro" x="360" y="232" width="96" height="14" rx="7"/>
<path class="linha" d="M528 240H584M608 224l32 32m0-32-32 32"/>
<rect class="card" x="704" y="168" width="160" height="296" rx="32"/>
<rect class="tinta" x="728" y="192" width="112" height="24" rx="8"/>
<rect class="neutro" x="728" y="256" width="112" height="14" rx="7"/>
<rect class="neutro" x="728" y="296" width="88" height="14" rx="7"/>
<rect class="neutro" x="728" y="336" width="112" height="14" rx="7"/>
<!-- The manual route stays available. -->
<rect class="principal" x="336" y="384" width="176" height="80" rx="24"/>
<rect class="card" x="360" y="408" width="96" height="14" rx="7"/>
