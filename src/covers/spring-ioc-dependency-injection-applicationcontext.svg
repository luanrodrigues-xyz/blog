<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<style>
svg { --bg:#F2F2F7; --card:#fff; --neutral:#E5E5EA; --primary:#34C759; --tint:#DDF5E3; --other:#6155F5; --other-tint:#E7E4FD; }
@media(prefers-color-scheme:dark) { svg { --bg:#1C1C1E; --card:#2C2C2E; --neutral:#3A3A3C; --primary:#4BD166; --tint:color-mix(in srgb,var(--primary) 30%,var(--card)); --other:#6D7CFF; --other-tint:color-mix(in srgb,var(--other) 22%,var(--card)); } .shadow { filter:none; } }
.bg { fill:var(--bg); } .card { fill:var(--card); } .neutral { fill:var(--neutral); } .primary { fill:var(--primary); } .tint { fill:var(--tint); } .other { fill:var(--other); } .other-tint { fill:var(--other-tint); }
.route { fill:none; stroke:var(--primary); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
.boundary { fill:none; stroke:var(--neutral); stroke-width:4; }
</style>
<defs><filter id="sombra" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter></defs>
<rect class="bg" width="1200" height="630"/>
<!-- Container boundary groups the selected dependency and consumer. -->
<rect class="boundary" x="312" y="80" width="400" height="472" rx="32"/>
<g class="shadow" filter="url(#sombra)"><rect class="tint" x="360" y="128" width="304" height="128" rx="24"/><rect class="card" x="360" y="376" width="304" height="128" rx="32"/></g>
<rect class="primary" x="392" y="168" width="240" height="14" rx="7"/><rect class="primary" x="392" y="200" width="160" height="14" rx="7"/>
<!-- One selected route enters the service. -->
<path class="route" d="M512 256V360"/><polygon class="primary" points="512,372 502,352 522,352"/>
<rect class="neutral" x="392" y="416" width="240" height="14" rx="7"/><rect class="neutral" x="392" y="448" width="160" height="14" rx="7"/>
<!-- The alternative has no selected route. -->
<rect class="other-tint" x="760" y="128" width="128" height="128" rx="24"/><rect class="other" x="784" y="168" width="80" height="14" rx="7"/><rect class="other" x="784" y="200" width="48" height="14" rx="7"/>
</svg>
